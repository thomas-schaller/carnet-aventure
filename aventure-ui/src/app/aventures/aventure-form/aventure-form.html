        <mat-card class="items-center gap-4 px-5 py-6 text-center sm:px-8">
            <mat-card-title class="text-2xl font-semibold">Nouvelle aventure</mat-card-title>
            <mat-card-content class="w-full">
                <form (ngSubmit)="submit()" class="mx-auto flex w-full max-w-2xl flex-col items-stretch justify-center gap-3 sm:flex-row sm:items-start">
                    <mat-form-field>
                        <mat-label>Titre</mat-label>
                        <input matInput type="text" [formControl]="titre"/>
                    </mat-form-field>
                    <button matButton="filled" class="shrink-0" type="submit">
                        <span class="material-symbols-outlined" aria-hidden="true">add</span>
                        <span>Créer l'aventure</span>
                    </button>
                </form>
            </mat-card-content>
        </mat-card>
