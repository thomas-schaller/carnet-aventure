        <mat-card class="mb-3 flex flex-wrap gap-8 justify-center">
            <mat-card-title><h1 class="text-2xl mb-3 ">Nouvelle aventure</h1></mat-card-title>
            <mat-card-content>
                <form (ngSubmit)="submit()" class="flex gap-4">
                    <mat-form-field>
                        <mat-label>Titre</mat-label>
                        <input matInput type="text" [formControl]="titre"/>
                    </mat-form-field>
                    <button matButton="filled" type="submit" aria-label="Créer une aventure">
                        <span class="material-symbols-outlined" aria-hidden="true">add</span>
                    </button>
                </form>
            </mat-card-content>
        </mat-card>
