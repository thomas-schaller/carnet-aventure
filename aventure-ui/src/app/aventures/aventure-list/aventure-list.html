<section class="space-y-5">
    <app-aventure-form />
    @if (store.loading()) {
        <p class="py-8 text-center text-sm text-emerald-100/60">Chargement...</p>
    }

    @for (aventure of store.aventures();track aventure.id) {
        <app-aventure-card [aventure]="aventure" />
    } @empty { 
        <p class="rounded-xl border border-dashed border-emerald-900/60 px-5 py-8 text-center text-sm text-emerald-100/60">Aucune aventure disponible.</p>
    }
</section>
