        <mat-card class="mb-3">
            <h2 >Nouvelle scène :</h2>
             <form (ngSubmit)="submit()">
                <mat-form-field>
                    <mat-label>Titre</mat-label>
                    <input matInput type="text" [formControl]="titre" />
                </mat-form-field>
                <quill-editor placeholder="Description"  [modules]="editorModules" 
      theme="snow" [formControl]="description" [style]="{ height: '320px' }" >
                </quill-editor>
                <button matButton="filled" (click)="submit()">
                <span class="material-symbols-outlined" aria-hidden="true">add</span>
            </button>
            </form>
        </mat-card>
