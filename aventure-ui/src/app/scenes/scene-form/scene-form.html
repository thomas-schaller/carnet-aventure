        <mat-card class="mb-3">
            <h2 >Nouvelle scène :</h2>
             <form (ngSubmit)="submit()">
                <mat-form-field>
                    <mat-label>Titre</mat-label>
                    <input matInput type="text" [formControl]="titre" />
                </mat-form-field>
                <quill-editor type="text" placeholder="Description" [formControl]="description" [style]="{ height: '320px' }" >
                </quill-editor>
                <button matButton="filled" type="submit">Soumettre</button>
            </form>
        </mat-card>
